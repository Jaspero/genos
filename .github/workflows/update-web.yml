name: Prod | Update Web
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Release Type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - partial
      release:
        description: 'Release Version'
        required: false
env:
  PROJECT: genos-ec52a
  TARGET: web
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Use Node.js 20.9.0
        uses: actions/setup-node@v1
        with:
          node-version: 20.9.0
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Copy Build
        id: copy
        working-directory: web
        run: npm run copy:prod          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.32.1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Configure Release
        id: config
        run: JOB=start TYPE=partial npm run configure-release          
      - name: Build
        if: contains(github.ref, 'build')
        working-directory: web
        run: npm run build:prod
      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f --all web/.svelte-kit
          git add -f --all public
          git commit -m "BOT - update build branch"
      - name: Deploy
        if: contains(github.ref, 'build')
        run: firebase deploy --only hosting:$TARGET --project $PROJECT --non-interactive
      - name: Update Release Status
        if: contains(github.ref, 'build')
        run: JOB=finish npm run configure-release
