name: Prod | Deploy Web
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'web/**/*'
      - 'shared/**/*'
env:
  PROJECT: genos-ec52a
  TARGET: web
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Use Node.js 20.9.0
        uses: actions/setup-node@v1
        with:
          node-version: 20.9.0
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Dependencies
        run: npm ci
      - name: Copy Build
        id: copy
        working-directory: web
        run: npm run copy:prod        
      - name: Install Dependencies Web
        working-directory: web
        run: npm ci
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.32.1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Configure Release
        id: config
        run: JOB=start npm run configure-release        
      - name: Build
        working-directory: web
        run: npm run build:prod
      - name: Deploy
        run: firebase deploy --only hosting:$TARGET --project $PROJECT --non-interactive
      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f --all web/.svelte-kit
          git add -f --all web/node_modules
          git add -f --all node_modules
          git add -f --all public
          git commit -m "BOT - Connected build branch"
      # Remove the build branch in case it already exists
      # this ensures clean code
      - name: Delete build branch
        uses: dawidd6/action-delete-branch@v3
        with:
          github_token: ${{ github.token }}
          branches: build
      - name: Push
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: 'build'
          force: true
      - name: Update Release Status
        run: JOB=finish npm run configure-release
